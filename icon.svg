<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ferrylink">
  <title>Ferrylink</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1E5AA0"/>
      <stop offset="0.55" stop-color="#123C72"/>
      <stop offset="1" stop-color="#0A2344"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB63F"/>
      <stop offset="1" stop-color="#E8760F"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- open sea -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- far wave -->
    <path d="M0,434 C 68,408 124,408 180,434 C 236,460 292,460 348,434 C 404,408 460,408 512,434 L512,512 L0,512 Z"
          fill="#1F5E9C"/>
    <!-- near wave -->
    <path d="M0,472 C 76,446 132,446 188,472 C 244,498 300,498 356,472 C 412,446 468,446 512,472 L512,512 L0,512 Z"
          fill="#3B8CD0"/>

    <!-- download arrow, the dominant element -->
    <rect x="236" y="60" width="44" height="170" rx="10" fill="#FFFFFF"/>
    <path d="M162,226 L350,226 L256,320 Z" fill="#FFFFFF"/>

    <!-- ferry waiting below, carrying the download home -->
    <rect x="218" y="332" width="76" height="40" rx="12" fill="#FFFFFF"/>
    <rect x="236" y="344" width="40" height="11" rx="5" fill="#7FB3E0"/>
    <path d="M162,378 L350,378 Q360,378 357,387 L340,410 Q336,416 328,416 L184,416 Q176,416 172,410 L155,387 Q152,378 162,378 Z"
          fill="url(#hull)"/>
    <rect x="149" y="366" width="214" height="12" rx="6" fill="#FFFFFF"/>
  </g>
</svg>
